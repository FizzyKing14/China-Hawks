name: Build Windows EXE

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [ "claude/fivem-case-analyzer-1msrv2" ]
    paths: [ "fivem_case_analyzer/**" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: python -m pip install --upgrade pyinstaller openpyxl

      - name: 打包 EXE
        working-directory: fivem_case_analyzer
        run: pyinstaller --onefile --noconsole --icon "icon.ico" --add-data "icon.ico;." --name "案件罪名分析器" app.py

      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: 案件罪名分析器-windows
          path: fivem_case_analyzer/dist/*.exe
          if-no-files-found: error
